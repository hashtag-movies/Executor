services:
  - type: web
    name: hashtag-executor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn executor.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CORE_URL
        value: https://hashtag-core.onrender.com
      - key: GITHUB_OWNER
        value: hashtag-movies
      - key: HASHTAG_DISABLE_PERMISSIONS
        value: "1"
